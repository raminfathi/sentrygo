<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentryGo | داشبورد امنیتی</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts (Vazirmatn for Persian) -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#3b82f6', // blue
                            600: '#2563eb',
                        },
                        dark: {
                            bg: '#0f172a', // slate-900
                            card: '#1e293b', // slate-800
                            border: '#334155', // slate-700
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-animate { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-dark-bg text-slate-200 h-screen flex overflow-hidden selection:bg-brand-500 selection:text-white text-sm md:text-base">

    <!-- Sidebar / Bottom Nav (Mobile) -->
    <nav class="fixed bottom-0 w-full bg-dark-card border-t border-dark-border z-50 md:relative md:w-64 md:border-t-0 md:border-l border-dark-border flex-shrink-0 flex md:flex-col justify-around md:justify-start">
        
        <!-- Logo Area (Hidden on small mobile, visible on md+) -->
        <div class="hidden md:flex items-center gap-3 p-6 border-b border-dark-border">
            <div class="bg-brand-500 text-white p-2 rounded-lg">
                <i class="ph ph-shield-check text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wider">SentryGo</h1>
                <p class="text-xs text-slate-400">سیستم امنیتی هوشمند</p>
            </div>
        </div>

        <!-- Nav Links -->
        <div class="flex md:flex-col w-full p-2 md:p-4 gap-2">
            <button onclick="switchTab('live-view', this)" class="nav-btn active flex-1 md:flex-none flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl bg-brand-500/10 text-brand-500 transition-all">
                <i class="ph ph-video-camera text-xl"></i>
                <span class="hidden md:block font-medium">پخش زنده</span>
            </button>
            <button onclick="switchTab('archive', this)" class="nav-btn flex-1 md:flex-none flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl text-slate-400 hover:bg-dark-border/50 hover:text-white transition-all">
                <i class="ph ph-folder-open text-xl"></i>
                <span class="hidden md:block font-medium">آرشیو هشدارها</span>
            </button>
            <button onclick="switchTab('settings', this)" class="nav-btn flex-1 md:flex-none flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl text-slate-400 hover:bg-dark-border/50 hover:text-white transition-all">
                <i class="ph ph-gear-six text-xl"></i>
                <span class="hidden md:block font-medium">تنظیمات سیستم</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-[calc(100vh-64px)] md:h-screen overflow-y-auto">
        
        <!-- Header -->
        <header class="flex items-center justify-between p-4 md:p-6 border-b border-dark-border bg-dark-bg/80 backdrop-blur sticky top-0 z-40">
            <h2 id="page-title" class="text-xl md:text-2xl font-bold text-white">دوربین زنده</h2>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <span id="status_label" class="text-red-400 font-bold text-sm md:text-base animate-pulse">سیستم فعال است (Armed)</span>
                    <button id="toggle-system" onclick="toggleSystem()" class="relative inline-flex h-6 w-11 items-center rounded-full bg-red-500 transition-colors focus:outline-none">
                        <span id="toggle-knob" class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-1"></span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Tab Content Container -->
        <div class="p-4 md:p-6">
            
<!-- 1. Live View Tab -->
            <section id="live-view" class="tab-content block space-y-6">
                <!-- Video Player Placeholder -->
                <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-dark-border shadow-2xl flex items-center justify-center group">
                    
                    <!-- تگ استریم زنده دوربین (اضافه شده) -->
                    <img src="/api/stream" alt="Live Camera Stream" class="absolute inset-0 w-full h-full object-cover z-10" />
                    
                    <!-- Overlay Controls (Visible on hover) -->
                    <div class="absolute bottom-0 w-full p-4 bg-gradient-to-t from-black/80 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex justify-between items-center z-20">
                        <div class="flex items-center gap-2 text-red-500 font-medium">
                            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                            LIVE
                        </div>
                        <button class="bg-white/20 hover:bg-white/30 backdrop-blur p-2 rounded-lg transition text-white">
                            <i class="ph ph-corners-out text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-wrap gap-4">
                    <button onclick="requestVideo()" class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-brand-600 hover:bg-brand-500 text-white py-3 px-6 rounded-xl font-medium transition shadow-lg shadow-brand-500/20">
                        <i class="ph ph-video-camera"></i>
                        درخواست ضبط ۲۵ ثانیه‌ای
                    </button>
                <button onclick="takeSnapshot()" class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-dark-card border border-dark-border hover:bg-dark-border text-white py-3 px-6 rounded-xl font-medium transition">
                    <i class="ph ph-camera"></i>
                    گرفتن عکس لحظه‌ای
                </button>
                </div>
            </section>

            <!-- 2. Archive Tab -->
            <section id="archive" class="tab-content hidden space-y-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-white">رویدادهای اخیر</h3>
                    <!-- دکمه پاکسازی فعلا مخفی شد تا بعدا API آن را بسازیم -->
                    <!-- <button class="text-brand-500 text-sm hover:underline">پاکسازی آرشیو</button> -->
                </div>
                
                <!-- فقط همین یک خط برای لود داینامیک تصاویر و ویدیوها کافی است -->
                <div id="archive-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            </section>

            <!-- 3. Settings Tab (.env Manager) -->
            <section id="settings" class="tab-content hidden max-w-3xl mx-auto space-y-6 pb-20">
                
                <div class="bg-brand-500/10 border border-brand-500/20 text-brand-400 p-4 rounded-xl flex gap-3 text-sm">
                    <i class="ph ph-info flex-shrink-0 text-xl"></i>
                    <p>تغییرات این بخش مستقیماً در فایل <code>.env</code> سرور لینوکس ذخیره می‌شوند و برنامه به صورت خودکار با تنظیمات جدید راه‌اندازی می‌شود.</p>
                </div>

                <form onsubmit="saveSettings(event)" class="space-y-6">
                    
                    <!-- Camera Settings -->
                    <div class="bg-dark-card border border-dark-border p-5 rounded-2xl">
                        <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2 border-b border-dark-border pb-2">
                            <i class="ph ph-camera"></i> تنظیمات دوربین Hikvision
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-slate-400 text-sm mb-1">IP دوربین</label>
                                <input type="text" id="camera_ip" dir="ltr" placeholder="مثال: 192.168.1.64" class="w-full bg-dark-bg border border-dark-border rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand-500">
                            </div>
                            <div>
                                <label class="block text-slate-400 text-sm mb-1">نام کاربری</label>
                                <input type="text" id="camera_user" dir="ltr" class="w-full bg-dark-bg border border-dark-border rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand-500">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-slate-400 text-sm mb-1">رمز عبور</label>
                                <input type="password" id="camera_pass" dir="ltr" class="w-full bg-dark-bg border border-dark-border rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand-500">
                            </div>
                        </div>
                    </div>

                    <!-- SMS Settings -->
                    <div class="bg-dark-card border border-dark-border p-5 rounded-2xl">
                        <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2 border-b border-dark-border pb-2">
                            <i class="ph ph-chat-text"></i> پیامک و پترن (FarazSMS)
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="md:col-span-2">
                                <label class="block text-slate-400 text-sm mb-1">کلید API (API_KEY)</label>
                                <input type="password" id="sms_api_key" dir="ltr" placeholder="API Key" class="w-full bg-dark-bg border border-dark-border rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand-500">
                            </div>
                            <div>
                                <label class="block text-slate-400 text-sm mb-1">پترن هشدار خطر</label>
                                <input type="text" id="sms_pattern" dir="ltr" placeholder="مثال: 3hAr214cYc" class="w-full bg-dark-bg border border-dark-border rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand-500 text-center font-mono">
                            </div>
                            <div>
                                <label class="block text-slate-400 text-sm mb-1">پترن راه‌اندازی (Startup)</label>
                                <input type="text" id="sms_startup_pattern" dir="ltr" placeholder="مثال: zDfnN2hDZz" class="w-full bg-dark-bg border border-dark-border rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand-500 text-center font-mono">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-slate-400 text-sm mb-1">شماره‌های دریافت هشدار (با ویرگول جدا کنید)</label>
                                <input type="text" id="sms_phones" dir="ltr" placeholder="0918..., 0914..." class="w-full bg-dark-bg border border-dark-border rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand-500">
                            </div>
                        </div>
                    </div>

                    <!-- Bots Settings -->
                    <div class="bg-dark-card border border-dark-border p-5 rounded-2xl">
                        <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2 border-b border-dark-border pb-2">
                            <i class="ph ph-robot"></i> توکن ربات‌ها
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-slate-400 text-sm mb-1">توکن تلگرام (TELEGRAM_BOT_TOKEN)</label>
                                <input type="password" id="telegram_bot_token" dir="ltr" placeholder="توکن تلگرام" class="w-full bg-dark-bg border border-dark-border rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand-500">
                            </div>
                            <div>
                                <label class="block text-slate-400 text-sm mb-1">توکن بله (BALE_BOT_TOKEN)</label>
                                <input type="password" id="bale_bot_token" dir="ltr" placeholder="توکن بله" class="w-full bg-dark-bg border border-dark-border rounded-lg px-4 py-2 text-white focus:outline-none focus:border-brand-500">
                            </div>
                        </div>
                    </div>


                </form>
                <!-- Action Buttons -->
                    <div class="flex justify-end gap-3">
                        <button type="button" onclick="restartSystem()" class="bg-red-600/20 hover:bg-red-600/40 text-red-500 border border-red-900/50 py-3 px-6 rounded-xl font-bold transition flex items-center gap-2">
                            <i class="ph ph-arrows-clockwise text-xl"></i>
                            ری‌استارت سرور
                        </button>
                        <button type="submit" class="bg-brand-600 hover:bg-brand-500 text-white py-3 px-8 rounded-xl font-bold transition shadow-lg shadow-brand-500/20 flex items-center gap-2">
                            <i class="ph ph-floppy-disk text-xl"></i>
                            ذخیره تنظیمات
                        </button>
                    </div>
            </section>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-4 z-50 flex flex-col gap-2"></div>

    <!-- Scripts -->
    <script>
        // --- Navigation Logic ---
        const titles = {
            'live-view': 'دوربین زنده',
            'archive': 'آرشیو هشدارها',
            'settings': 'تنظیمات سیستم'
        };

        function switchTab(tabId, btnElement) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            // Remove active state from all buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-brand-500/10', 'text-brand-500');
                btn.classList.add('text-slate-400');
            });
            
            // Show selected tab
            document.getElementById(tabId).classList.remove('hidden');
            // Add active state to clicked button
            btnElement.classList.add('bg-brand-500/10', 'text-brand-500');
            btnElement.classList.remove('text-slate-400');
            
            // Update Header Title
            document.getElementById('page-title').innerText = titles[tabId];
        }

        // --- System Toggle Logic (Arm/Disarm) ---
        let isArmed = true;
        function toggleSystem() {
            isArmed = !isArmed;
            const textEl = document.getElementById('system-status-text');
            const knobEl = document.getElementById('toggle-knob');
            const btnEl = document.getElementById('toggle-system');

            if (isArmed) {
                textEl.innerText = "سیستم فعال است (Armed)";
                textEl.className = "text-red-400 font-bold text-sm md:text-base animate-pulse";
                btnEl.classList.remove('bg-slate-600');
                btnEl.classList.add('bg-red-500');
                knobEl.classList.add('translate-x-1');
                knobEl.classList.remove('-translate-x-5');
                showToast("دزدگیر روشن شد", "error");
            } else {
                textEl.innerText = "سیستم غیرفعال است (Disarmed)";
                textEl.className = "text-slate-400 font-bold text-sm md:text-base";
                btnEl.classList.remove('bg-red-500');
                btnEl.classList.add('bg-slate-600');
                knobEl.classList.remove('translate-x-1');
                knobEl.classList.add('-translate-x-5');
                showToast("دزدگیر موقتاً خاموش شد", "info");
            }
        }

        // --- Mock Actions ---
        function requestVideo() {
            showToast("در حال ضبط ویدیو ۲۵ ثانیه‌ای از محیط...", "info");
            // Here we would make an API call to the Go backend
            setTimeout(() => {
                showToast("ویدیو در آرشیو ذخیره شد", "success");
            }, 3000);
        }

        function saveSettings(e) {
            e.preventDefault();
            showToast("در حال ذخیره متغیرها در فایل .env ...", "info");
            // Simulate API latency
            setTimeout(() => {
                showToast("تنظیمات با موفقیت بروزرسانی شد و سرویس ری‌استارت شد.", "success");
            }, 1500);
        }

        // --- Toast Notification System ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            // Colors based on type
            let bgClass = 'bg-dark-card border-dark-border';
            let icon = 'ph-info';
            let iconColor = 'text-brand-500';

            if(type === 'success') { icon = 'ph-check-circle'; iconColor = 'text-green-500'; }
            if(type === 'error') { icon = 'ph-warning-circle'; iconColor = 'text-red-500'; }

            toast.className = `toast-animate flex items-center gap-3 px-4 py-3 rounded-lg border ${bgClass} shadow-xl text-white min-w-[250px]`;
            toast.innerHTML = `
                <i class="ph ${icon} ${iconColor} text-xl"></i>
                <span class="text-sm font-medium">${message}</span>
            `;

            container.appendChild(toast);

            // Remove after 3.5 seconds
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>

<script>
    // ۱. لود تمام تنظیمات از سرور هنگام باز شدن صفحه

    let smsSenderLine = "90008361";
    fetch('/api/settings')
    .then(response => response.json())
    .then(data => {
        // الف) لود فیلدهای معمولی
        const simpleFields = {
            'camera_ip': 'CAMERA_IP',
            'camera_user': 'CAMERA_USER',
            'camera_pass': 'CAMERA_PASS',
            'sms_pattern': 'SMS_PATTERN_CODE',
            'sms_startup_pattern': 'SMS_STARTUP_PATTERN',
            'telegram_bot_token': 'TELEGRAM_BOT_TOKEN',
            'bale_bot_token': 'BALE_BOT_TOKEN'
        };

        Object.keys(simpleFields).forEach(htmlId => {
            const el = document.getElementById(htmlId);
            if (el && data[simpleFields[htmlId]]) {
                el.value = data[simpleFields[htmlId]];
            }
        });

        // ب) پردازش و جداسازی ساختار پیچیده SMS_ACCOUNTS
        let rawSms = data['SMS_ACCOUNTS'] || '';
        if(rawSms) {
            let accounts = rawSms.split(',');
            let phonesList = [];
            let mainApiKey = '';

            accounts.forEach(acc => {
                let parts = acc.split(':'); // خروجی: [ApiKey, Phone, SenderLine]
                if(parts.length === 3) {
                    if(!mainApiKey) mainApiKey = parts[0]; // استخراج کلید مشترک
                    phonesList.push(parts[1]); // جمع‌آوری شماره موبایل‌ها
                    smsSenderLine = parts[2]; // ذخیره خط فرستنده (مثلا 90008361) برای استفاده مجدد
                }
            });

            // تزریق داده‌های جدا شده به فرم
            if(document.getElementById('sms_api_key')) document.getElementById('sms_api_key').value = mainApiKey;
            if(document.getElementById('sms_phones')) document.getElementById('sms_phones').value = phonesList.join(', ');
        }
    });
    // ۲. ذخیره تمامی تنظیمات با یک کلیک
    function saveSettings(e) {
    if (e) e.preventDefault(); // جلوگیری از رفرش شدن فرم
    
    // بازسازی ساختار پیچیده پیامک برای ذخیره در .env
    let apiKey = document.getElementById('sms_api_key')?.value || '';
    let rawPhones = document.getElementById('sms_phones')?.value || '';
    
    // جدا کردن شماره‌ها با ویرگول و حذف فاصله‌های اضافه
    let phonesArray = rawPhones.split(',').map(p => p.trim()).filter(p => p !== '');
    
    // ساخت رشته نهایی (ApiKey:Phone:SenderLine,...)
    let builtSmsAccounts = phonesArray.map(phone => `${apiKey}:${phone}:${smsSenderLine}`).join(',');

    const payload = {
        CAMERA_IP: document.getElementById('camera_ip')?.value || '',
        CAMERA_USER: document.getElementById('camera_user')?.value || '',
        CAMERA_PASS: document.getElementById('camera_pass')?.value || '',
        SMS_ACCOUNTS: builtSmsAccounts, // ارسال رشته ترکیبی به سرور
        SMS_PATTERN_CODE: document.getElementById('sms_pattern')?.value || '',
        SMS_STARTUP_PATTERN: document.getElementById('sms_startup_pattern')?.value || '',
        TELEGRAM_BOT_TOKEN: document.getElementById('telegram_bot_token')?.value || '',
        BALE_BOT_TOKEN: document.getElementById('bale_bot_token')?.value || ''
    };

        fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => alert(data.message))
        .catch(err => alert("خطا در ذخیره تنظیمات"));
}

    // ۳. تابع ری‌استارت سیستم
    function restartSystem() {
        if(confirm("آیا از راه‌اندازی مجدد هسته سیستم مطمئن هستید؟")) {
            fetch('/api/restart', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    setTimeout(() => window.location.reload(), 3000); // رفرش خودکار صفحه بعد از ۳ ثانیه
                })
                .catch(err => alert("خطا در ارتباط با سرور برای ری‌استارت"));
        }
    }

    // ۴. توابع کنترل دوربین (عکس و فیلم)
    function takeSnapshot() {
        fetch('/api/action/snapshot', { method: 'POST' })
            .then(res => res.json())
            .then(data => alert(data.message))
            .catch(err => alert("خطا در ارتباط با سرور"));
    }

    function requestVideo() {
        fetch('/api/action/record', { method: 'POST' })
            .then(res => res.json())
            .then(data => alert(data.message))
            .catch(err => alert("خطا در ارتباط با سرور"));
    }

    // ۵. توابع لود گالری و آرشیو
    function loadArchive() {
        fetch('/api/archive')
            .then(res => res.json())
            .then(files => {
                const container = document.getElementById('archive-grid');
                if (!container) return;
                
                container.innerHTML = '';
                if (files.length === 0) {
                    container.innerHTML = '<p class="text-slate-400 col-span-full text-center">هیچ فایلی در آرشیو وجود ندارد.</p>';
                    return;
                }

                files.forEach(file => {
                    let mediaElement = file.type === 'video' 
                        ? `<video src="${file.url}" controls class="w-full aspect-video object-cover rounded-lg"></video>`
                        : `<img src="${file.url}" class="w-full aspect-video object-cover rounded-lg cursor-pointer hover:opacity-80 transition" onclick="window.open('${file.url}')" />`;
                    
                    container.innerHTML += `
                        <div class="bg-dark-card border border-dark-border p-2 rounded-xl flex flex-col justify-between">
                            ${mediaElement}
                            <p class="text-xs text-center mt-2 text-slate-400 truncate" dir="ltr">${file.name}</p>
                        </div>
                    `;
                });
            })
            .catch(err => console.error("خطا در لود آرشیو"));
    }

    loadArchive();

    // لود اولیه وضعیت کلید و متن
    fetch('/api/status').then(res => res.json()).then(data => {
        updateToggleUI(data.armed);
    });

    // ارسال درخواست تغییر وضعیت به سرور
    function toggleSystem() {
        fetch('/api/status', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                updateToggleUI(data.armed);
            })
            .catch(err => alert("خطا در ارتباط با سرور"));
    }

    // تابع کمکی برای تغییر ظاهر دکمه و متن
    function updateToggleUI(isArmed) {
        let t = document.getElementById('system_toggle');
        let label = document.getElementById('status_label');
        
        if(t) t.checked = isArmed;
        
        if(label) {
            if(isArmed) {
                label.innerText = "سیستم فعال است (Armed)";
                label.className = "text-red-500 font-bold";
            } else {
                label.innerText = "سیستم غیرفعال است (Disarmed)";
                label.className = "text-slate-400 font-bold";
            }
        }
    }
</script>
</body>
</html>
